name: Google Trends (PSX retail interest)

# Free retail search-interest proxy for PSX/KSE-100. New 2026-09-01. Uses
# pytrends (unofficial Google Trends API) -- no key needed, but no SLA
# either; failures here are expected occasionally (rate-limiting), not a
# regression to chase. See connectors/google_trends.py.

on:
  schedule:
    - cron: '0 7 * * 1-5'      # 12:00 PKT, Mon-Fri (once midday is enough)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: google-trends
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: '.github/requirements-ci.txt'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r .github/requirements-ci.txt

      - name: Refresh Google Trends
        run: python scripts/refresh_google_trends.py
        continue-on-error: true   # unofficial API, rate-limiting is expected

      - name: Commit updates
        run: |
          git config user.name  "psx-bot"
          git config user.email "psx-bot@users.noreply.github.com"
          git add data/sentiment/google_trends.parquet 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git commit -m "data: google trends $(date -u +%F)"
          for i in 1 2 3 4 5; do
            if git push; then exit 0; fi
            echo "Push attempt $i rejected; rebasing on latest main..."
            git pull --rebase --autostash origin main || exit 1
            sleep $((i * 2))
          done
          echo "Push failed after 5 attempts."
          exit 1
